name: build-ios

# Builds the 150 days tracker as a native iPhone app (an unsigned .ipa, signed on the phone by SideStore or on a PC by Sideloadly).
# Runs when the ios-app branch is pushed, or by hand from the Actions tab.
# Besides 150-days.ipa the release also gets source.json, a SideStore / AltStore source, so SideStore offers every build as an update.
on:
  push:
    branches: [ios-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # goes into the app's Info.plist and into source.json; SideStore offers an update when this is higher than the installed one
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          pod --version || true

      - name: Gather the web app
        run: |
          mkdir -p www
          cp index.html style.css app.js strokes.js manifest.webmanifest www/
          cp ./*.png www/
          cp -R fonts www/fonts
          ls -la www

      - name: Create the iOS project
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor/haptics@7 @capacitor/status-bar@7 @capacitor/keyboard@7 @capacitor/share@7 @capacitor/filesystem@7
          cp ios-native/capacitor.config.json capacitor.config.json
          npx cap add ios
          npx cap sync ios
          bash ios-native/prepare.sh

      - name: Stamp the version
        run: |
          PL=ios/App/App/Info.plist
          for KEY_VALUE in "CFBundleShortVersionString:$APP_VERSION" "CFBundleVersion:$APP_BUILD"; do
            KEY=${KEY_VALUE%%:*}; VALUE=${KEY_VALUE#*:}
            /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "$PL" || /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" "$PL"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PL"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PL"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build \
            | tee xcodebuild.log | tail -60

      - name: Package the .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "App.app" | head -1)
          echo "app bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 150-days.ipa Payload
          ls -la 150-days.ipa

      - name: Check the built app carries the version
        run: |
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/App.app/Info.plist)
          echo "built app version: $BUILT, expected: $APP_VERSION"
          test "$BUILT" = "$APP_VERSION"

      - name: Generate the SideStore source
        run: python3 ios-native/make-source.py --ipa 150-days.ipa --version "$APP_VERSION" --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --out source.json

      - uses: actions/upload-artifact@v4
        with:
          name: 150-days-ipa
          path: 150-days.ipa

      - name: Publish the .ipa as a release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --cleanup-tag -y || true
          gh release create ios-latest 150-days.ipa source.json --target "$GITHUB_SHA" \
            --title "150 days, iPhone app (unsigned)" \
            --notes "Unsigned build $APP_VERSION for SideStore or Sideloadly. Built from $GITHUB_SHA. SideStore source: https://github.com/$GITHUB_REPOSITORY/releases/download/ios-latest/source.json"
